name: APK e Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commits:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: versions
        env:
          BEFORE: ${{ github.event.before || github.sha }}
          AFTER: ${{ github.sha }}
        run: python3 scripts/commits.py
  build:
    needs: commits
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testar, compilar e assinar
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tomatobr-signing.jks
        run: |
          umask 077
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Configure os Secrets de assinatura.'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          python3 scripts/build.py --version-code '${{ matrix.code }}' --version-name '${{ matrix.version }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tomato-br-${{ matrix.version }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --version '${{ matrix.version }}' --sha '${{ matrix.sha }}'
